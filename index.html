<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <title>Diego Tepichin — Ingeniero de sistemas · Pricing, ML y herramientas para LATAM</title>
    <meta
      name="description"
      content="Diego Tepichin, ingeniero de sistemas y fundador de CAFE. Precios dinámicos con inferencia causal, machine learning y herramientas abiertas para México y Latinoamérica."
    />
    <meta name="theme-color" content="#f2efe9" />

      content="Causal dynamic pricing, machine learning and open tools for Mexico and Latin America."

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
